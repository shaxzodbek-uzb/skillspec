<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 297" width="860" height="297" role="img" aria-label="skillspec">
  <title>skillspec</title>
  <defs><style>
      .bg{fill:#0d1117}.bar{fill:#161b22}
      .t{font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px}
      .dim{fill:#7d8590}.fg{fill:#e6edf3}.cy{fill:#79c0ff}.gr{fill:#3fb950}
      .rd{fill:#f85149}.yl{fill:#d29922}.mg{fill:#d2a8ff}
  </style></defs>
  <rect class="bg" width="860" height="297" rx="10"/>
  <rect class="bar" width="860" height="30" rx="10"/>
  <rect class="bar" y="20" width="860" height="10"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/><circle cx="38" cy="15" r="5" fill="#febc2e"/><circle cx="56" cy="15" r="5" fill="#28c840"/>
  <text class="t dim" x="430" y="20" text-anchor="middle">skillspec</text>
  <text class="t" x="20" y="60"><tspan class="gr">$</tspan> <tspan class="fg">npx skillspec</tspan></text>
  <text class="t cy" x="20" y="93">skills/pdf-tools/SKILL.md</text>
  <text class="t rd" x="20" y="114">  2:1   error    `name` &quot;pdf&quot; does not match the parent directory &quot;pdf-tools&quot;.</text>
  <text class="t dim" x="20" y="135">                 The spec requires them to be identical.        name-matches-dir</text>
  <text class="t yl" x="20" y="156">  3:1   warning  `description` is only 16 characters — too thin for Claude to</text>
  <text class="t dim" x="20" y="177">                 match reliably.                            description-min-length</text>
  <text class="t yl" x="20" y="198">  4:1   warning  Unknown frontmatter key &quot;allowed_tools&quot;. Did you mean</text>
  <text class="t dim" x="20" y="219">                 &quot;allowed-tools&quot;?                        unknown-frontmatter-key</text>
  <text class="t rd" x="20" y="252">✖ 4 problems (1 error, 3 warnings) across 3 skills</text>
  <text class="t yl" x="20" y="273">Exit 1 on errors, 0 when clean — drop it straight into CI.</text>
</svg>
